name: Deploy Firecrawl

on:
  push:
    branches: [master]
    paths:
      - "services/firecrawl/**"
      - "kubernetes/apps/firecrawl.yaml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, monolith]
    steps:
      - uses: actions/checkout@v4

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f services/firecrawl/kubernetes/namespace.yaml
          kubectl apply -f services/firecrawl/kubernetes/configmap.yaml
          # Secret values are provisioned outside Git. Never apply secret.yaml.
          kubectl get secret firecrawl-secret -n firecrawl -o name
          kubectl apply -f services/firecrawl/kubernetes/postgres-pvc.yaml
          kubectl apply -f services/firecrawl/kubernetes/service.yaml
          kubectl apply -f services/firecrawl/kubernetes/deployment.yaml
          kubectl apply -f services/firecrawl/kubernetes/ingress.yaml

      - name: Apply ArgoCD Application
        run: |
          # Apply the ArgoCD Application to the cluster so it appears in the
          # ArgoCD UI. The App of Apps root watches kubernetes/apps/ and
          # auto-syncs, but this explicit apply ensures the child Application
          # is created immediately without waiting for the next 3-minute
          # sync cycle or repo-server cache refresh.
          kubectl apply -f kubernetes/apps/firecrawl.yaml -n argocd

      - name: Verify every deployment rollout
        run: |
          for component in api redis postgres rabbitmq; do
            kubectl rollout status "deployment/firecrawl-$component" -n firecrawl --timeout=600s
          done
          kubectl get pods -n firecrawl
          kubectl get application firecrawl -n argocd -o wide
          echo "Deployment rollouts passed; a real scrape is still required for commissioning."
