name: Deploy UPS telemetry only

on:
  pull_request:
    branches: [master]
    paths:
      - 'services/ups/**'
      - '.github/workflows/deploy-ups-telemetry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ups-telemetry-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependency
        run: python -m pip install ansible-core==2.18.6
      - name: Check telemetry playbook syntax
        working-directory: services/ups/ansible
        run: ansible-playbook playbooks/telemetry.yml --syntax-check
      - name: Test protection against replacing existing shutdown management
        run: python services/ups/ansible/tests/test_telemetry_gates.py
  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, watchtower]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner identity and existing Ansible
        run: |
          test "$(hostname -s)" = watchtower
          test "$(id -un)" = speddling
          ansible-playbook --version
      - name: Deploy local telemetry with the shutdown monitor masked
        working-directory: services/ups/ansible
        run: ansible-playbook playbooks/telemetry.yml
