name: Provision Firecrawl credentials

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/firecrawl/**'
      - '.github/workflows/provision-firecrawl-credentials.yml'
  workflow_dispatch:
    inputs:
      maintenance_ack:
        description: Back up the unused Firecrawl installation, rotate credentials and reload API/broker pods
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firecrawl-credentials-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: firecrawl
          POSTGRES_DB: firecrawl
          POSTGRES_PASSWORD: changeme-fixture
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        options: >-
          --health-cmd "pg_isready -U firecrawl -d firecrawl"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Test credential and backup gates without production access
        env:
          FIRECRAWL_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m unittest discover -s scripts/firecrawl -p 'test_*.py'

  provision:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.maintenance_ack
    runs-on: [self-hosted, monolith]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner identity
        run: test "$(hostname -s)/$(id -un)" = monolith/gh-runner
      - name: Provision through the existing speddling SSH login
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/id_ed25519" speddling@192.168.30.10 \
            'sudo -n /usr/bin/python3 - --maintenance-ack' < scripts/firecrawl/credentials.py
