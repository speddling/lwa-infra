name: Configure graceful Construct shutdown

on:
  pull_request:
    branches: [master]
    paths:
      - 'services/construct/ansible/**'
      - '.github/workflows/configure-construct-shutdown.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: construct-lifecycle-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependency
        run: python -m pip install ansible-core==2.18.6
      - name: Test lifecycle helpers without shutting down any system
        run: python services/construct/ansible/tests/test_graceful_shutdown.py
      - name: Syntax-check lifecycle playbook
        working-directory: services/construct/ansible
        run: ansible-playbook playbooks/graceful-shutdown.yml --syntax-check
  configure:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, monolith]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner identity and existing Ansible
        run: |
          test "$(hostname -s)" = monolith
          test "$(id -un)" = gh-runner
          ansible-playbook --version
      - name: Install and probe lifecycle control without stopping the guest
        working-directory: services/construct/ansible
        run: ansible-playbook playbooks/graceful-shutdown.yml
