name: Bootstrap Construct VM

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Force rebuild (destroys existing VM)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  provision:
    name: Provision Construct VM
    runs-on: [self-hosted, monolith]
    steps:
      - uses: actions/checkout@v4

      - name: Write vault password
        run: |
          mkdir -p ~/lwa-homelab
          echo '${{ secrets.ANSIBLE_VAULT_PASSWORD }}' > ~/lwa-homelab/.vault_pass
          chmod 600 ~/lwa-homelab/.vault_pass

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.general ansible.posix

      - name: Destroy existing VM (if rebuild requested)
        if: github.event.inputs.rebuild == 'true'
        run: |
          # Stop systemd service (manages QEMU via systemd)
          sudo systemctl stop construct 2>/dev/null || true
          sudo systemctl disable construct 2>/dev/null || true

          # Kill ANY stray QEMU processes (covers manually-started VMs too)
          for pid in $(ps aux | grep qemu-system | grep -v grep | awk '{print $2}'); do
            sudo kill -9 $pid 2>/dev/null || true
          done
          sleep 2

          # Unmount the construct LV if still mounted
          sudo umount /vm/construct 2>/dev/null || true
          sudo umount /mnt/construct-iso 2>/dev/null || true

          # Remove the LVM logical volume (correct VG name per defaults: ubuntu-vg)
          sudo lvremove -f /dev/ubuntu-vg/construct 2>/dev/null || true

          # Wipe stale artifacts — per Plane #97, Ansible 'creates:' guards
          # will skip regenerating disk.img/cloud-init.iso if they exist,
          # so we must delete them here to force a fresh build.
          sudo rm -rf /vm/construct
          echo 'Construct VM destroyed'

      - name: Run Ansible — Provision Construct
        working-directory: services/monolith/ansible
        run: |
          ansible-playbook -i inventory.ini playbooks/construct.yml \
            --vault-password-file ~/lwa-homelab/.vault_pass

      - name: Wait for VM to boot
        run: sleep 90

      - name: Verify VM is running
        run: |
          echo "Checking systemd service status..."
          sudo systemctl status construct --no-pager || true

          echo ""
          echo "Waiting for SSH port 2222 to be accessible (up to 3 minutes)..."
          timeout 180 bash -c 'until timeout 1 bash -c "</dev/tcp/localhost/2222" 2>/dev/null; do echo "  Waiting..."; sleep 5; done'
          echo "Construct VM is accessible on port 2222"

          echo ""
          echo "Verifying SSH authentication..."
          timeout 180 bash -c 'until timeout 5 ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 2222 speddling@127.0.0.1 "echo SSH_OK" 2>/dev/null; do echo "  Waiting for SSH auth..."; sleep 5; done'
          echo "SSH authentication working"

      - name: Display connection info
        run: |
          echo "Construct VM provisioned successfully!"
          echo ""
          echo "Connect via:"
          echo "  ssh -p 2222 speddling@127.0.0.1  (port forward from monolith)"
          echo "  ssh -p 2222 speddling@monolith.littlewolfacres.com (from Apex or Studio)"
