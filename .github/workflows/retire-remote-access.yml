name: Retire Tailscale and wmux

on:
  pull_request:
    branches: [master]
    paths:
      - 'services/construct/ansible/**'
      - 'services/monolith/ansible/roles/construct-vm/**'
      - '.github/workflows/retire-remote-access.yml'
  workflow_dispatch:
    inputs:
      lan_ssh_verified:
        description: 'Fresh key-authenticated SSH from Apex/Studio to monolith:2222 verified; wmux sessions may stop'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: retire-remote-access-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: python -m pip install ansible-core==2.18.6
      - name: Render cloud-init and check embedded shell syntax
        run: python services/construct/ansible/tests/check_config.py
      - name: Verify removal cannot bypass the prerequisites
        run: python services/construct/ansible/tests/test_retirement_gates.py
      - name: Verify wmux stops without a session D-Bus socket
        run: python services/construct/ansible/tests/test_wmux_stop.py
      - name: Syntax-check retirement playbook
        working-directory: services/construct/ansible
        run: ansible-playbook playbooks/retire-remote-access.yml --syntax-check
  retire:
    needs: validate
    if: github.ref == 'refs/heads/master' && inputs.lan_ssh_verified
    runs-on: [self-hosted, monolith]
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner location
        run: test "$(hostname -s)" = monolith
      - name: Verify the host connection does not depend on Tailscale
        run: |
          route=$(ip route get 192.168.30.10)
          if [[ "$route" == *tailscale* ]]; then
            echo 'Monolith SSH route depends on Tailscale; stopping before removal.'
            exit 1
          fi
      - name: Verify Ansible is available
        run: ansible-playbook --version
      - name: Syntax check
        working-directory: services/construct/ansible
        run: ansible-playbook playbooks/retire-remote-access.yml --syntax-check
      - name: Retire services through ordinary SSH
        working-directory: services/construct/ansible
        run: ansible-playbook playbooks/retire-remote-access.yml -e lan_ssh_verified=true
