# Legacy bootstrap placeholders, still owned by ArgoCD during the handoff.
# No Ansible generator exists. Do not put real credentials in this file.
# First deploy and verify the retention annotations below; only a later change
# may exclude this manifest from ArgoCD and provision credentials out of Git.
---
apiVersion: v1
kind: Secret
metadata:
  name: firecrawl-secret
  namespace: firecrawl
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app: firecrawl
    component: secret
type: Opaque
stringData:
  DATABASE_URL: "postgresql://firecrawl:changeme-postgres@firecrawl-postgres:5432/firecrawl"
  NUQ_DATABASE_URL: "postgresql://firecrawl:changeme-postgres@firecrawl-postgres:5432/firecrawl"
  REDIS_URL: "redis://firecrawl-redis:6379"
  REDIS_PASSWORD: ""
  RABBITMQ_PASSWORD: "changeme-rabbitmq"
  POSTGRES_PASSWORD: "changeme-postgres"
  BULL_AUTH_KEY: "changeme-api-key"
  SELF_HOSTED_WEBHOOK_HMAC_SECRET: "changeme-webhook"
  TEST_API_KEY: "changeme-test"
  OPENAI_API_KEY: "changeme-openai"
  SLACK_WEBHOOK_URL: ""
  LLAMAPARSE_API_KEY: ""
  SUPABASE_ANON_TOKEN: ""
  SUPABASE_URL: ""
  SUPABASE_SERVICE_TOKEN: ""
  PROXY_PASSWORD: "changeme-proxy"
