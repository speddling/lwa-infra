# Run on the Monolith runner. Construct is reached through QEMU's SSH forward.
[retirement]
monolith ansible_host=192.168.30.10
construct ansible_host=127.0.0.1 ansible_port=2222 ansible_ssh_common_args='-o UserKnownHostsFile={{ inventory_dir }}/files/construct_known_hosts -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519'

[retirement:vars]
ansible_user=speddling
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
