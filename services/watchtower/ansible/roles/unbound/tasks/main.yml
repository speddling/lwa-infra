---
- name: Install unbound and dns utilities
  apt:
    name:
      - unbound
      - dnsutils
    state: present
    update_cache: yes

- name: Download root hints
  get_url:
    url: https://www.internic.net/domain/named.root
    dest: /var/lib/unbound/root.hints
    owner: root
    group: root
    mode: '0644'

- name: Disable systemd-resolved stub listener
  lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^#?DNSStubListener='
    line: 'DNSStubListener=no'

- name: Restart systemd-resolved to release port 53
  systemd:
    name: systemd-resolved
    state: restarted

- name: Deploy unbound config
  template:
    src: watchtower.conf.j2
    dest: /etc/unbound/unbound.conf.d/watchtower.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart unbound

- name: Disable Debian resolvconf helper
  ansible.builtin.systemd:
    name: unbound-resolvconf.service
    enabled: false
    masked: true
    state: stopped
  # Watchtower deliberately uses systemd-resolved for /etc/resolv.conf,
  # AdGuard Home on :53, and Unbound on loopback :5335. The package helper
  # attempts to register lo with resolvconf and fails because lo is not a
  # link that can receive DNS configuration. It is not part of this design.

- name: Clear stale resolvconf helper failure state
  ansible.builtin.command: systemctl reset-failed unbound-resolvconf.service
  changed_when: false
  # Masking prevents future starts; reset-failed removes the historical failed
  # result so systemd --failed reflects the current service state.

- name: Enable and start unbound
  systemd:
    name: unbound
    enabled: yes
    state: started
