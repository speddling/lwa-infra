[Unit]
Wants=network-online.target
After=network-online.target

[Service]
# network-online alone is not proof that this particular address is present.
ExecStartPre=/usr/local/sbin/lwa-nut-network-ready --address
# NUT 2.8.1 can remain active after binding only loopback. Fail and retry instead.
ExecStartPost=/usr/local/sbin/lwa-nut-network-ready --listeners
TimeoutStartSec=120s
Restart=on-failure
RestartSec=5s
