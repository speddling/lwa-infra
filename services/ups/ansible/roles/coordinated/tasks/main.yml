---
- name: Mask the shutdown monitor before installing packages
  ansible.builtin.systemd_service:
    name: nut-monitor.service
    masked: true
    daemon_reload: true
- name: Ensure the NUT configuration directory exists
  ansible.builtin.file:
    path: /etc/nut
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Record coordinated configuration ownership
  ansible.builtin.copy:
    dest: /etc/nut/lwa-coordinated
    content: "Managed by prepare-shutdown.yml; legacy/telemetry deployments must not overwrite.\n"
    owner: root
    group: root
    mode: '0600'
- name: Install NUT client without starting services
  ansible.builtin.apt:
    name: nut-client
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101
- name: Keep shutdown monitor stopped and disabled
  ansible.builtin.systemd_service:
    name: nut-monitor.service
    state: stopped
    enabled: false
    masked: true
    daemon_reload: true
- name: Retire the telemetry-only ownership marker
  ansible.builtin.file:
    path: /etc/nut/lwa-telemetry-only
    state: absent
- name: Render the host-specific monitor credentials
  ansible.builtin.template:
    src: upsmon.conf.j2
    dest: /etc/nut/upsmon.conf
    owner: root
    group: nut
    mode: '0640'
  no_log: true
- name: Configure NUT mode
  ansible.builtin.copy:
    dest: /etc/nut/nut.conf
    content: "MODE={{ 'netserver' if inventory_hostname == 'watchtower' else 'netclient' }}\n"
    owner: root
    group: nut
    mode: '0640'
- name: Install authentication probe
  ansible.builtin.copy:
    src: lwa-ups-auth-check
    dest: /usr/local/sbin/lwa-ups-auth-check
    owner: root
    group: root
    mode: '0755'
- name: Configure Watchtower's NUT server and observation policy
  when: inventory_hostname == 'watchtower'
  block:
    - name: Require an already-active firewall
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false
      failed_when: "ufw_status.rc != 0 or 'Status: active' not in ufw_status.stdout"
    - name: Allow NUT only from Monolith before opening the listener
      ansible.builtin.command: ufw allow from 192.168.30.10 to 192.168.30.11 port 3493 proto tcp comment 'Monolith NUT secondary'
      register: ufw_rule
      changed_when: "'Skipping' not in ufw_rule.stdout"
    - name: Create separate primary and secondary accounts
      ansible.builtin.template:
        src: upsd.users.j2
        dest: /etc/nut/upsd.users
        owner: root
        group: nut
        mode: '0640'
      no_log: true
    - name: Bind NUT to loopback and Watchtower Infra IP
      ansible.builtin.copy:
        src: upsd.conf
        dest: /etc/nut/upsd.conf
        owner: root
        group: nut
        mode: '0640'
    - name: Restart only the NUT data server
      ansible.builtin.systemd_service:
        name: nut-server.service
        state: restarted
        enabled: true
    - name: Install five-minute policy
      ansible.builtin.copy:
        src: lwa-ups-policy
        dest: /usr/local/sbin/lwa-ups-policy
        owner: root
        group: root
        mode: '0755'
    - name: Install observation service
      ansible.builtin.copy:
        src: lwa-ups-policy.service
        dest: /etc/systemd/system/lwa-ups-policy.service
        owner: root
        group: root
        mode: '0644'
    - name: Start policy in observation mode with no arming marker
      ansible.builtin.systemd_service:
        name: lwa-ups-policy.service
        state: restarted
        enabled: true
        daemon_reload: true

- name: Prepare Monolith's graceful Kubernetes shutdown without restarting services
  when: inventory_hostname == 'monolith'
  block:
    - name: Install the read-only unmanaged guest check
      ansible.builtin.copy:
        src: lwa-ups-check-vms
        dest: /usr/local/sbin/lwa-ups-check-vms
        owner: root
        group: root
        mode: '0755'
    - name: Create kubelet and logind configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /var/lib/rancher/k3s/agent/etc/kubelet.conf.d
        - /etc/systemd/logind.conf.d
    - name: Configure 120 seconds total pod shutdown with 30 seconds for critical pods
      ansible.builtin.copy:
        src: 20-lwa-ups.conf
        dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/20-lwa-ups.conf
        owner: root
        group: root
        mode: '0644'
    - name: Remove the superseded early-sorting managed logind fragment
      ansible.builtin.file:
        path: /etc/systemd/logind.conf.d/90-lwa-ups.conf
        state: absent
    - name: Allow the kubelet's shutdown inhibitor sufficient time
      ansible.builtin.copy:
        dest: /etc/systemd/logind.conf.d/zz-lwa-ups.conf
        content: "[Login]\nInhibitDelayMaxSec=150s\n"
        owner: root
        group: root
        mode: '0644'

- name: Verify the host's NUT credentials without sending FSD
  ansible.builtin.command: /usr/local/sbin/lwa-ups-auth-check
  changed_when: false
  register: auth_check
  retries: 6
  delay: 5
  until: auth_check.rc == 0
- name: Verify UPS data is reachable
  ansible.builtin.command: "upsc cyberpower@{{ nut_server_address }} ups.status"
  register: ups_status
  changed_when: false
- name: Verify preparation has not enabled automatic shutdown
  ansible.builtin.command: systemctl show nut-monitor.service --property=LoadState --property=ActiveState
  register: monitor_state
  changed_when: false
  failed_when: "'LoadState=masked' not in monitor_state.stdout_lines or 'ActiveState=inactive' not in monitor_state.stdout_lines"
