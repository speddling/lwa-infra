[ups_telemetry]
watchtower ansible_host=192.168.30.11 ansible_user=speddling ansible_ssh_private_key_file=~/.ssh/id_ed25519 ansible_python_interpreter=/usr/bin/python3

[ups_monolith]
monolith ansible_host=192.168.30.10 ansible_user=speddling ansible_ssh_private_key_file=~/.ssh/id_ed25519 ansible_python_interpreter=/usr/bin/python3

# Only the Monolith runner uses this entry; host trust is shared with lifecycle deployment.
[ups_construct]
construct ansible_host=127.0.0.1 ansible_port=2222 ansible_user=speddling ansible_ssh_private_key_file=~/.ssh/id_ed25519 ansible_python_interpreter=/usr/bin/python3 ansible_ssh_common_args='-o UserKnownHostsFile={{ inventory_dir }}/../../construct/ansible/files/construct_known_hosts -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519'
