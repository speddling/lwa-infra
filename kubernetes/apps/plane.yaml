# Plane Community Edition: fixed application release on the upstream 1.5.1 chart.
# The second source replaces only the chart's fixed-name migration Job with a
# Sync hook. See docs/plane-recovery.md for backup and upgrade requirements.
# TLS Certificate remains applied by bootstrap-plane.yml.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plane
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://helm.plane.so/
      chart: plane-ce
      targetRevision: "1.5.1"  # chart version; application release is pinned below
      helm:
        releaseName: plane   # explicit, not left to default inference — service DNS names below depend on this
        values: |
          planeVersion: v1.4.2

          ingress:
            enabled: true
            appHost: plane.littlewolfacres.com
            ingressClass: traefik
            ingress_annotations:
              nginx.ingress.kubernetes.io/proxy-body-size: "5m"

          ssl:
            createIssuer: false
            tls_secret_name: plane-tls

          postgres:
            local_setup: true
            storageClass: local-path
            volumeSize: 5Gi

          redis:
            local_setup: true
            storageClass: local-path
            volumeSize: 1Gi

          rabbitmq:
            local_setup: true
            storageClass: local-path
            volumeSize: 100Mi

          minio:
            local_setup: true
            storageClass: local-path
            volumeSize: 5Gi

          env:
            default_cluster_domain: cluster.local
            docstore_bucket: uploads
            doc_upload_size_limit: 5242880
            # Chart hardcodes WEB_URL as http://<appHost> with no override
            # field anywhere in values.yaml (confirmed via helm show values,
            # grepping for web_url/base_url/protocol/scheme/https — nothing).
            # cors_allowed_origins IS a real documented override, so fix that
            # one properly here. WEB_URL itself needs the ignoreDifferences
            # entry below plus a one-time live kubectl patch, since there's
            # no clean way to express "this is https-only" to this chart.
            cors_allowed_origins: "https://plane.littlewolfacres.com"

          external_secrets:
            pgdb_existingSecret: plane-pgdb-secret
            rabbitmq_existingSecret: plane-rabbitmq-secret
            doc_store_existingSecret: plane-docstore-secret
            app_env_existingSecret: plane-app-env-secret
            live_env_existingSecret: plane-live-env-secret

          # plane-worker OOMKilled (exitCode 137) against the chart's default
          # 1000Mi limit. Its Celery banner showed "concurrency: 16 (prefork)"
          # — 16 separate full-Python-process workers, not threads, each
          # loading the entire Django app independently. Celery's default
          # concurrency is the CPU count it detects, which on Monolith's
          # 8c/16t host is 16. Rather than fight that indirectly via CPU
          # limits (uncertain whether cgroup CPU quota reliably changes what
          # Celery detects), just give it real headroom — Monolith has it.
          worker:
            memoryLimit: 4096Mi
            memoryRequest: 512Mi
    - repoURL: https://github.com/speddling/lwa-infra
      targetRevision: master
      path: kubernetes/plane-overrides
  destination:
    server: https://kubernetes.default.svc
    namespace: plane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # Chart hardcodes HTTP; preserve the previously verified live HTTPS value.
    - group: ""
      kind: ConfigMap
      name: plane-app-vars
      namespace: plane
      jsonPointers:
        - /data/WEB_URL
    # Helm's now() changes at each render. Ignore only this generated field;
    # actual image, configuration and other annotation changes still reconcile.
    - group: apps
      kind: Deployment
      namespace: plane
      jsonPointers:
        - /spec/template/metadata/annotations/timestamp
