# Firecrawl — self-hosted web scraping and extraction API
# Managed by ArgoCD via apps-of-apps pattern. All manifests in services/firecrawl/kubernetes/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: firecrawl
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/speddling/lwa-infra
    targetRevision: master
    path: services/firecrawl/kubernetes
    directory:
      # Live retention was verified before this handoff. Credentials are
      # maintained by the backup-gated provisioning workflow, outside Git.
      exclude: secret.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: firecrawl
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
